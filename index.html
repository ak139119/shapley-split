<script>
/* ===================== helpers ===================== */
const COLORS=['#1F5FA8','#0E6B5C','#C08A2A','#7A4C9E','#B0460C','#2F7F9E','#9C3D6B','#5B7A1E','#6B5BD6','#8A6A4A','#2E5E8F','#B5651D'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=(n=20)=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';let s='';for(const x of crypto.getRandomValues(new Uint8Array(n)))s+=a[x%a.length];return s};
const DEL={__del:true};
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}if(v===DEL)delete a[ks.at(-1)];else a[ks.at(-1)]=v}
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=(x,d=1)=>Number.isFinite(x)?x.toFixed(d):'–';
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy this: '+t))}catch(e){toast('Copy this: '+t)}}
function factStr(n){if(n>20)return n+'!';let f=1;for(let i=2;i<=n;i++)f*=i;return f.toLocaleString()}

/* ===================== stores ===================== */
const CFG=window.FIREBASE_CONFIG||{};const LIVE_OK=!!(CFG.projectId&&CFG.apiKey);
let fb=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
async function initFirebase(){if(fb)return fb;const V='10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
  firebase.initializeApp(CFG);const cred=await firebase.auth().signInAnonymously();fb={db:firebase.firestore(),uid:cred.user.uid};return fb}
class LiveTeam{constructor(id){this.id=id;this.live=true}
  ref(){return fb.db.collection('shapley').doc(this.id)}
  me(){return fb.uid}
  async exists(){return (await this.ref().get()).exists}
  async create(d){d.owner=fb.uid;d.updatedAt=Date.now();await this.ref().set(d)}
  subscribe(cb,err){this.u1=this.ref().onSnapshot(s=>cb(s.exists?s.data():null),err)}
  async update(paths){const u={};for(const p in paths)u[p]=paths[p]===DEL?firebase.firestore.FieldValue.delete():paths[p];u.updatedAt=Date.now();await this.ref().update(u)}
  async getScore(){const s=await this.ref().collection('scores').doc(fb.uid).get();return s.exists?s.data():null}
  async setScore(d){await this.ref().collection('scores').doc(fb.uid).set(d)}
  watchScores(cb,err){if(this.u2)return;this.u2=this.ref().collection('scores').onSnapshot(q=>cb(q.docs.map(d=>({sid:d.id,...d.data()}))),e=>{this.u2=null;err&&err(e)})}
  unwatchScores(){if(this.u2){this.u2();this.u2=null}}}
class LocalTeam{constructor(id){this.id=id;this.live=false;this.key='ss-team-'+id;this.cbs=[];this.scb=null;
  this.bc=('BroadcastChannel' in window)?new BroadcastChannel('ss-'+id):null;if(this.bc)this.bc.onmessage=()=>this.emit()}
  me(){return 'local'}
  async exists(){return !!ls.get(this.key)}
  async create(d){d.owner='local';d.scores=d.scores||{};ls.set(this.key,d)}
  subscribe(cb){this.cbs.push(cb);setTimeout(()=>this.emit(),0)}
  emit(){const d=ls.get(this.key);if(!d)return;const pub={...d};delete pub.scores;this.cbs.forEach(cb=>cb(pub));if(this.scb)this.scb(Object.entries(d.scores||{}).map(([sid,s])=>({sid,...s})))}
  async update(paths){const d=ls.get(this.key);for(const p in paths)setPath(d,p,paths[p]);d.updatedAt=Date.now();ls.set(this.key,d);if(this.bc)this.bc.postMessage(1);this.emit()}
  async getScore(memberId){const d=ls.get(this.key);return (d.scores||{})['m_'+memberId]||null}
  async setScore(data){const d=ls.get(this.key);d.scores=d.scores||{};d.scores['m_'+data.memberId]=data;ls.set(this.key,d);if(this.bc)this.bc.postMessage(1)}
  watchScores(cb){const first=!this.scb;this.scb=cb;if(first)setTimeout(()=>this.emit(),0)}
  unwatchScores(){this.scb=null}}

/* ===================== model ===================== */
let store=null,R=null,SCORES=[],S=null,SCORES_LOADED=false;
let ui={tab:null,scorer:null,draft:null,sel:[],confirmReveal:false};
function fpOf(team){const m=Object.keys(team.members||{}).sort().join(',');const g=Object.entries(team.groups||{}).map(([id,x])=>id+':'+[...x.members].sort().join('.')).sort().join(',');
  let h=0;for(const c of m+'|'+g)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36)}
function buildS(){const t=R.team||{};const members=Object.entries(t.members||{}).sort((a,b)=>(a[1].o||0)-(b[1].o||0)).map(([id,m])=>({id,name:m.name||'?'}));
  const groups=Object.entries(t.groups||{}).sort((a,b)=>(a[1].o||0)-(b[1].o||0)).map(([id,g])=>({id,members:(g.members||[]).filter(x=>(t.members||{})[x]),note:g.note||''})).filter(g=>g.members.length>=2);
  const fp=fpOf(t);const valid=SCORES.filter(s=>s.f===fp);
  S={team:{name:t.name||'Team',pool:Number.isFinite(t.pool)?t.pool:10,members,groups},sets:valid.map(s=>({by:s.by,byId:s.memberId||s.sid,solo:s.solo||{},syn:s.syn||{}})),stale:SCORES.length-valid.length,fp,example:!!R.example}}
const isFac=()=>!store.live||R.owner===store.me();
const col=id=>COLORS[Math.max(0,S.team.members.findIndex(m=>m.id===id))%COLORS.length];
const nameOf=id=>(S.team.members.find(m=>m.id===id)||{name:'?'}).name;
const gName=g=>g.members.map(nameOf).join(' + ');
function participants(){const sub=R.submitted||{};return Object.entries(sub).map(([uid,p])=>({uid,...p}))}

/* ===================== maths ===================== */
function averaged(){const solo={},syn={},spread={};const T=S.team;
  const items=[...T.members.map(m=>['s',m.id]),...T.groups.map(g=>['g',g.id])];
  for(const [k,id] of items){const vals=S.sets.map(x=>(k==='s'?x.solo:x.syn)[id]).filter(v=>Number.isFinite(v));
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;(k==='s'?solo:syn)[id]=avg;spread[k+id]={n:vals.length,min:Math.min(...vals),max:Math.max(...vals),avg}}
  return{solo,syn,spread}}
function shapley(solo,syn){const T=S.team;const phi={},parts={};let total=0;
  T.members.forEach(m=>{phi[m.id]=solo[m.id]||0;parts[m.id]=[{label:'solo',v:solo[m.id]||0}];total+=solo[m.id]||0});
  T.groups.forEach(g=>{const v=syn[g.id]||0;total+=v;g.members.forEach(id=>{if(!(id in phi))return;phi[id]+=v/g.members.length;
    parts[id].push({label:(g.members.length===2?'½':'1/'+g.members.length)+' of '+gName(g),v:v/g.members.length})})});
  return{phi,parts,total}}
function shares(phi,total){const pot=100-S.team.pool;const out={};for(const id in phi)out[id]=total>0?phi[id]/total*pot:NaN;return out}
function crossCheck(solo,syn){const T=S.team,n=T.members.length;if(n>14||n<1)return null;const t0=performance.now();
  const idx={};T.members.forEach((m,i)=>idx[m.id]=i);const N=1<<n;const v=new Float64Array(N);
  const gm=T.groups.map(g=>({mask:g.members.reduce((a,id)=>a|(1<<idx[id]),0),val:syn[g.id]||0}));
  for(let s=1;s<N;s++){let x=0;for(let i=0;i<n;i++)if(s&(1<<i))x+=solo[T.members[i].id]||0;for(const g of gm)if((s&g.mask)===g.mask)x+=g.val;v[s]=x}
  const fact=[1];for(let i=1;i<=n;i++)fact[i]=fact[i-1]*i;const pc=s=>{let c=0;while(s){s&=s-1;c++}return c};
  const phi=new Array(n).fill(0);
  for(let i=0;i<n;i++){const b=1<<i;for(let s=0;s<N;s++){if(s&b)continue;const k=pc(s);phi[i]+=fact[k]*fact[n-k-1]/fact[n]*(v[s|b]-v[s])}}
  return{phi,coalitions:N-1,ms:performance.now()-t0}}

/* ===================== example ===================== */
function exampleDoc(){const members={},groups={};let o=1;const m=(id,name)=>members[id]={name,o:o++};
  m('alex','Alex');m('sam','Sam');m('jordan','Jordan');m('taylor','Taylor');m('casey','Casey');
  const g=(id,ms,note)=>groups[id]={members:ms,note,o:o++};
  g('g1',['alex','sam'],'Vision + working product = fundable');g('g2',['sam','casey'],'Return-point data that actually runs');g('g3',['alex','jordan'],'Pitch + community');
  g('g4',['alex','casey'],'Handshakes into signed contracts');g('g5',['sam','taylor'],'Product that works at the return point');g('g6',['jordan','taylor'],'Design the campus loves');g('g7',['alex','sam','jordan'],'The trio that can launch');
  const team={name:'LoopBox',pool:10,members,groups};
  return{v:1,example:true,team,revealed:true,submitted:{},scores:{video:{by:'Video estimates',memberId:null,f:fpOf(team),t:Date.now(),solo:{alex:10,sam:8,jordan:6,taylor:4,casey:4},syn:{g1:20,g2:10,g3:8,g4:8,g5:6,g6:4,g7:12}}}}}
function blankDoc(){return{v:1,team:{name:'My team',pool:10,members:{},groups:{}},revealed:false,submitted:{}}}

/* ===================== routing ===================== */
function route(){const h=location.hash.slice(1);const m=h.match(/^(team|local)=([A-Za-z0-9]{8,40})$/);
  if(m)return openTeam(m[1],m[2]);if(h==='example')return openExample();renderHome()}
window.addEventListener('hashchange',route);
async function openExample(){const st=new LocalTeam('LoopBoxExample');if(!(await st.exists()))await st.create(exampleDoc());location.hash='local=LoopBoxExample'}
function header(){const t=R&&R.team;$('#teamBadge').hidden=!t;if(t)$('#teamBadge').textContent=(R.example?'Example · ':'')+(t.name||'Team')+' · '+Object.keys(t.members||{}).length+' people';
  $('#syncBadge').textContent=store?(store.live?'Live':'This device only'):(LIVE_OK?'Live sync on':'This device only');
  $('#topActions').innerHTML=store?`${store.live?'<button class="btn small" type="button" id="copyLink">Copy team link</button>':''}${R&&R.example?'<button class="btn small ghost" type="button" id="resetEx">Reset example</button>':''}<a class="btn small ghost" href="#">All teams</a>`:'';
  const cl=$('#copyLink');if(cl)cl.addEventListener('click',()=>copyText(location.href.split('#')[0]+'#team='+store.id));
  const re=$('#resetEx');if(re)re.addEventListener('click',async()=>{await new LocalTeam('LoopBoxExample').create(exampleDoc());store.emit();toast('Example reset')})}
function remember(){const k=store.live?'team':'local';const r=(ls.get('ss-recent')||[]).filter(x=>!(x.k===k&&x.id===store.id));r.unshift({k,id:store.id,t:(R.team||{}).name});ls.set('ss-recent',r.slice(0,10))}

/* ===================== home ===================== */
function renderHome(){store=null;R=null;$('#app').hidden=true;const h=$('#home');h.hidden=false;header();
  const recent=(ls.get('ss-recent')||[]).slice(0,6);
  h.innerHTML=`<div class="cards">
   <div class="card"><h3>Explore the example</h3><p class="muted">The LoopBox team from the course video, already scored and revealed.</p><a class="btn" href="#example">Open the LoopBox example</a></div>
   <div class="card"><h3>Start a team</h3><p class="muted">${LIVE_OK?'You become the facilitator. Share the team link; each founder scores on their own device.':'Live sync is not set up in this copy. Founders take turns scoring on this one device.'}</p>
    <label class="row" style="gap:8px;font-size:14px"><input type="checkbox" id="fromEx"> Start from the LoopBox setup</label><button class="btn primary" type="button" id="newTeam">Create team</button></div>
   <div class="card"><h3>Join your team</h3><p class="muted">Paste the team link your facilitator shared.</p><input type="text" id="joinLink" placeholder="https://…#team=…" aria-label="Team link"><button class="btn" type="button" id="joinBtn">Open team</button></div>
  </div>
  ${recent.length?`<div class="panel"><h3>Recently opened on this device</h3><div class="list">${recent.map(r=>`<div class="item"><span class="grow">${esc(r.t||'Untitled team')}</span><span class="muted">${r.k==='team'?'Live':'This device'}</span><a class="btn small" href="#${r.k}=${esc(r.id)}">Open</a></div>`).join('')}</div></div>`:''}`;
  $('#newTeam').addEventListener('click',async()=>{let d=blankDoc();if($('#fromEx').checked){const e=exampleDoc();d.team=e.team}else{d.team.members[rid(8)]={name:'Founder 1',o:1};d.team.members[rid(8)]={name:'Founder 2',o:2};d.team.members[rid(8)]={name:'Founder 3',o:3}}
    const id=rid(22);try{if(LIVE_OK){await initFirebase();await new LiveTeam(id).create(d);location.hash='team='+id}else{await new LocalTeam(id).create(d);location.hash='local='+id}}catch(e){toast('Could not create the team: '+e.message)}});
  $('#joinBtn').addEventListener('click',()=>{const v=$('#joinLink').value.trim();const m=v.match(/#?((?:team|local)=[A-Za-z0-9]{8,40})/);if(m)location.hash=m[1];else toast('That does not look like a team link')})}

/* ===================== open a team ===================== */
async function openTeam(kind,id){if(store&&store.unwatchScores)store.unwatchScores();$('#home').hidden=true;$('#app').hidden=false;ui={tab:null,scorer:null,draft:null,sel:[],confirmReveal:false};SCORES=[];SCORES_LOADED=false;
  showMsg('Opening the team…');
  try{if(kind==='team'){if(!LIVE_OK)throw new Error('This link needs live sync, but this copy of the app has no Firebase settings.');await initFirebase();store=new LiveTeam(id)}else store=new LocalTeam(id);
    if(!(await store.exists()))throw new Error('No team found at this link. Check that the whole link was copied.');
    let first=true;
    store.subscribe(d=>{if(!d)return;R=d;
      if(R.revealed)store.watchScores(list=>{SCORES=list;SCORES_LOADED=true;buildS();rerender()},e=>{console.error(e)});else{store.unwatchScores();SCORES=[];SCORES_LOADED=false}
      buildS();header();if(first){first=false;remember();
        const mine=participants().find(p=>p.uid===store.me());if(store.live&&mine)ui.scorer=mine.memberId;
        setTab(R.revealed?'results':(isFac()&&!participants().length?'setup':'score'))}else rerender()},e=>{showMsg('The connection to the team was lost. Reload the page to try again.');console.error(e)})}
  catch(e){showMsg(e.message,true)}}
function showMsg(m,back){['setup','score','status','results','method'].forEach(k=>$('#view-'+k).hidden=true);let el=$('#appMsg');if(!el){el=document.createElement('div');el.id='appMsg';el.className='panel';$('#app').appendChild(el)}
  el.hidden=false;el.innerHTML=`<p>${esc(m)}</p>${back?'<div class="row"><a class="btn" href="#">Back to start</a></div>':''}`}

/* ===================== tabs ===================== */
function setTab(t){ui.tab=t;const m=$('#appMsg');if(m)m.hidden=true;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['setup','score','status','results','method'].forEach(k=>$('#view-'+k).hidden=k!==t);RENDER[t]()}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function rerender(){if(!ui.tab)return;const act=document.activeElement;const inView=act&&$('#view-'+ui.tab).contains(act)&&/INPUT|TEXTAREA|SELECT/.test(act.tagName);
  if(ui.tab==='score'){renderScoreStatus();return}if(inView)return;RENDER[ui.tab]()}
const W=paths=>store.update(paths).catch(e=>{toast('Not saved: '+(e.message||'check your connection'));console.error(e)});

/* ===================== 1. setup ===================== */
function renderSetup(){const T=S.team,n=T.members.length,fac=isFac(),dis=fac?'':'disabled';const anySub=participants().some(p=>p.state==='submitted')||SCORES.length;
  $('#view-setup').innerHTML=`
  ${fac?'':'<div class="callout">Only the facilitator can change the team setup. You can see it here.</div>'}
  ${fac&&anySub?'<div class="callout warn">Scores have already been submitted. Changing people or synergies now means everyone must score again.</div>':''}
  <div class="grid2">
   <div class="panel">
    <div class="panel-h"><h2>Team</h2><span class="muted">${n} people</span></div>
    <div class="row"><label class="lbl" for="tName" style="min-width:110px">Team name</label><input type="text" id="tName" value="${esc(T.name)}" style="flex:1" ${dis}></div>
    <div class="row"><label class="lbl" for="tPool" style="min-width:110px">Option pool %</label><input type="number" id="tPool" min="0" max="50" step="1" value="${T.pool}" ${dis}><span class="muted">Shapley splits the other ${100-T.pool}%.</span></div>
    <div class="list">${T.members.map(m=>`<div class="item"><span class="dot" style="background:${col(m.id)}"></span>
      <input type="text" data-mname="${m.id}" value="${esc(m.name)}" class="grow" aria-label="Name of team member" ${dis}>
      ${fac?`<button class="btn small ghost" type="button" data-mdel="${m.id}" ${n<=2?'disabled':''} aria-label="Remove ${esc(m.name)}">Remove</button>`:''}</div>`).join('')}</div>
    ${fac?`<div class="row"><input type="text" id="newMember" placeholder="Add a person" aria-label="New team member name" style="flex:1"><button class="btn" type="button" id="addMember">Add person</button></div>`:''}
   </div>
   <div class="panel">
    <div class="panel-h"><h2>Synergies</h2><span class="muted">${T.groups.length} groups</span></div>
    <p class="muted">List only the combinations that create value together. Pairs are most common. Add a trio or larger group when the value only appears with all of them.</p>
    <div class="list">${T.groups.map(g=>`<div class="item"><div class="row grow" style="gap:6px">${g.members.map(id=>`<span class="dot" style="background:${col(id)}"></span>`).join('')}<b>${esc(gName(g))}</b></div>
      <input type="text" data-gnote="${g.id}" value="${esc(g.note)}" placeholder="Why this works" aria-label="Why ${esc(gName(g))} creates value" style="flex:2 1 220px" ${dis}>
      ${fac?`<button class="btn small ghost" type="button" data-gdel="${g.id}">Remove</button>`:''}</div>`).join('')||'<p class="muted">No synergies yet. With none, Shapley simply pays each person their solo value.</p>'}</div>
    ${fac?`<div class="callout"><div class="lbl" style="margin-bottom:8px">New synergy: pick 2 or more people</div>
      <div class="row">${T.members.map(m=>`<button type="button" class="chip" data-pick="${m.id}" aria-pressed="${ui.sel.includes(m.id)}"><span class="dot" style="background:${col(m.id)}"></span>${esc(m.name)}</button>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" type="button" id="addGroup" ${ui.sel.length<2?'disabled':''}>Add synergy${ui.sel.length>=2?': '+esc(ui.sel.map(nameOf).join(' + ')):''}</button></div></div>`:''}
   </div>
  </div>
  ${store.live?`<div class="panel"><div class="panel-h"><h2>Invite the team</h2></div><p>Send the team link to every founder. Each one opens it, chooses their name under <b>Score privately</b>, and scores on their own device.</p>
   <div class="row"><button class="btn primary" type="button" id="copyLink2">Copy team link</button><span class="muted">Anyone with the link can score as a team member. Only you can change the setup and reveal the scores.</span></div></div>`
   :`<div class="panel"><div class="panel-h"><h2>Scoring on one device</h2></div><p>Live sync is off in this copy, so founders take turns on this device under <b>Score privately</b>. Each person's numbers disappear from the screen as soon as they submit.</p></div>`}`;
  const v=$('#view-setup');const c2=$('#copyLink2');if(c2)c2.addEventListener('click',()=>copyText(location.href.split('#')[0]+'#team='+store.id));
  if(!fac)return;
  $('#tName').addEventListener('change',e=>W({'team.name':e.target.value.trim()||'Team'}));
  $('#tPool').addEventListener('change',e=>W({'team.pool':Math.max(0,Math.min(50,Math.round(+e.target.value||0)))}));
  v.querySelectorAll('[data-mname]').forEach(i=>i.addEventListener('change',e=>W({['team.members.'+e.target.dataset.mname+'.name']:e.target.value.trim()||'?'})));
  v.querySelectorAll('[data-mdel]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.mdel;const u={['team.members.'+id]:DEL};
    for(const g of S.team.groups)if(g.members.includes(id)){const rest=g.members.filter(x=>x!==id);u['team.groups.'+g.id]=rest.length>=2?{...R.team.groups[g.id],members:rest}:DEL}
    ui.sel=ui.sel.filter(x=>x!==id);W(u)}));
  const add=()=>{const nm=$('#newMember').value.trim();if(!nm)return;W({['team.members.'+rid(8)]:{name:nm,o:Date.now()}}).then(()=>setTimeout(()=>{const n=$('#newMember');n&&n.focus()},50))};
  $('#addMember').addEventListener('click',add);$('#newMember').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  v.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.pick;ui.sel=ui.sel.includes(id)?ui.sel.filter(x=>x!==id):[...ui.sel,id];renderSetup()}));
  $('#addGroup').addEventListener('click',()=>{const key=[...ui.sel].sort().join('.');if(S.team.groups.some(g=>[...g.members].sort().join('.')===key)){toast('That synergy is already listed');return}
    const order=S.team.members.map(m=>m.id);const ms=[...ui.sel].sort((a,b)=>order.indexOf(a)-order.indexOf(b));ui.sel=[];W({['team.groups.'+rid(8)]:{members:ms,note:'',o:Date.now()}})});
  v.querySelectorAll('[data-gnote]').forEach(i=>i.addEventListener('change',e=>W({['team.groups.'+e.target.dataset.gnote+'.note']:e.target.value})))}

/* ===================== 2. score ===================== */
async function renderScore(){const T=S.team;const v=$('#view-score');
  if(R.example){v.innerHTML=`<div class="panel"><h2>This is a finished example</h2><p class="muted">The LoopBox scores are already revealed. Create your own team on the start page to try private scoring.</p></div>`;return}
  if(ui.scorer&&!T.members.some(m=>m.id===ui.scorer))ui.scorer=null;
  const taken=participants().filter(p=>p.uid!==store.me());
  v.innerHTML=`
  <div class="panel">
   <div class="panel-h"><h2>Score privately</h2><span id="scoreState"></span></div>
   <div class="seal"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <p class="muted">${store.live?'Your scores are sealed. Nobody, the facilitator included, can see them until the facilitator reveals all scores at once. You can change them until then.':'Scoring on one device: when you submit, your numbers disappear from the screen so the next person cannot see them.'}</p></div>
   <div class="row"><label class="lbl" for="who">I am</label>
    <select id="who" ${R.revealed?'disabled':''}><option value="">Choose your name</option>${T.members.map(m=>{const t=store.live&&taken.find(p=>p.memberId===m.id);return `<option value="${m.id}" ${ui.scorer===m.id?'selected':''}>${esc(m.name)}${t?' (already joined)':''}</option>`}).join('')}</select></div>
  </div>
  <div id="scoreBody"></div>`;
  $('#who').addEventListener('change',async e=>{ui.scorer=e.target.value||null;ui.draft=null;ui.done=false;
    if(ui.scorer&&store.live)await W({['submitted.'+store.me()]:{memberId:ui.scorer,name:nameOf(ui.scorer),state:((R.submitted||{})[store.me()]||{}).state==='submitted'?'submitted':'joined',t:Date.now()}});
    renderScoreBody()});
  renderScoreStatus();renderScoreBody()}
function renderScoreStatus(){const el=$('#scoreState');if(!el)return;const me=(R.submitted||{})[store.me()];
  if(R.revealed)el.innerHTML='<span class="badge ok">Scores revealed</span>';
  else if(store.live&&me&&me.state==='submitted')el.innerHTML=`<span class="badge ok">Submitted as ${esc(me.name)}</span>`;
  else el.innerHTML='<span class="badge grey">Not submitted yet</span>'}
async function renderScoreBody(){const T=S.team;const box=$('#scoreBody');if(!box)return;
  if(R.revealed){box.innerHTML=`<div class="panel"><p>Scores are revealed. See <b>Results</b>. The facilitator can reopen scoring for a second round after the team has discussed the disagreements.</p></div>`;return}
  if(!ui.scorer){box.innerHTML=`<div class="panel"><p class="muted">Choose your name to start. Score alone, without looking at anyone else's numbers.</p></div>`;return}
  if(ui.done&&!store.live){box.innerHTML=`<div class="panel callout ok"><h3>Submitted for ${esc(nameOf(ui.scorer))}</h3><p>Pass the device to the next person. They choose their own name above.</p></div>`;return}
  if(!ui.draft){let ex=null;try{ex=await store.getScore(ui.scorer)}catch(e){}const d={solo:{},syn:{}};
    T.members.forEach(m=>d.solo[m.id]=ex&&ex.f===S.fp&&Number.isFinite(ex.solo[m.id])?ex.solo[m.id]:'');T.groups.forEach(g=>d.syn[g.id]=ex&&ex.f===S.fp&&Number.isFinite(ex.syn[g.id])?ex.syn[g.id]:'');
    if(store.live)ui.draft=d;else ui.draft={solo:Object.fromEntries(T.members.map(m=>[m.id,''])),syn:Object.fromEntries(T.groups.map(g=>[g.id,'']))}}
  const D=ui.draft;
  box.innerHTML=`
  <div class="panel"><h3>How to score</h3>
   <p>Use one scale for the whole team: roughly <b>100 = the company with everyone on board</b>. Solo value is what each person could build alone. A synergy is the <i>extra</i> value that only appears when that group works together. A synergy can be negative when people overlap or clash. Leave a box blank if you have no view.</p></div>
  <div class="grid2">
   <div class="panel"><div class="panel-h"><h3>Solo value</h3><span class="muted">${T.members.length} scores</span></div>
    <div class="list">${T.members.map(m=>`<div class="item"><span class="dot" style="background:${col(m.id)}"></span><label for="so-${m.id}" class="grow">${esc(m.name)}${m.id===ui.scorer?' <span class="muted">(you)</span>':''}</label>
     <input type="number" id="so-${m.id}" data-solo="${m.id}" min="0" max="100" step="1" inputmode="numeric" value="${D.solo[m.id]??''}"></div>`).join('')}</div></div>
   <div class="panel"><div class="panel-h"><h3>Synergies</h3><span class="muted">${T.groups.length} scores</span></div>
    <div class="list">${T.groups.map(g=>`<div class="item"><div class="grow"><label for="sy-${g.id}"><b>${esc(gName(g))}</b></label>${g.note?`<div class="muted" style="font-size:13px">${esc(g.note)}</div>`:''}</div>
     <input type="number" id="sy-${g.id}" data-syn="${g.id}" min="-100" max="100" step="1" inputmode="numeric" value="${D.syn[g.id]??''}"></div>`).join('')||'<p class="muted">No synergies in this setup.</p>'}</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h3>Your scores give this split</h3><span class="muted" id="sumNote"></span></div>
   <div id="preview"></div>
   <div class="row"><button class="btn primary" type="button" id="submitScore">${((R.submitted||{})[store.me()]||{}).state==='submitted'&&store.live?'Update my scores':'Submit my scores'}</button><span class="muted" id="subMsg" role="status"></span></div></div>`;
  box.querySelectorAll('[data-solo]').forEach(i=>i.addEventListener('input',e=>{D.solo[e.target.dataset.solo]=e.target.value===''?'':+e.target.value;preview()}));
  box.querySelectorAll('[data-syn]').forEach(i=>i.addEventListener('input',e=>{D.syn[e.target.dataset.syn]=e.target.value===''?'':+e.target.value;preview()}));
  $('#submitScore').addEventListener('click',submitScore);preview()}
function packDraft(){const clean=o=>{const r={};for(const k in o)if(o[k]!==''&&Number.isFinite(+o[k]))r[k]=+o[k];return r};return{solo:clean(ui.draft.solo),syn:clean(ui.draft.syn)}}
async function submitScore(){const d=packDraft();if(!Object.keys(d.solo).length&&!Object.keys(d.syn).length){toast('Enter at least one score first');return}
  const btn=$('#submitScore');btn.disabled=true;
  try{await store.setScore({memberId:ui.scorer,by:nameOf(ui.scorer),f:S.fp,t:Date.now(),solo:d.solo,syn:d.syn});
    if(store.live)await store.update({['submitted.'+store.me()]:{memberId:ui.scorer,name:nameOf(ui.scorer),state:'submitted',f:S.fp,t:Date.now()}});
    else await store.update({['submitted.m_'+ui.scorer]:{memberId:ui.scorer,name:nameOf(ui.scorer),state:'submitted',f:S.fp,t:Date.now()}});
    toast('Scores submitted');if(!store.live){ui.done=true;ui.draft=null;const w=$('#who');if(w)w.value=ui.scorer}renderScoreStatus();renderScoreBody()}
  catch(e){toast(R.revealed?'Scores are already revealed, so they are locked.':'Not saved: '+(e.message||'check your connection'));btn.disabled=false}}
function preview(){const d=packDraft();const solo={},syn={};S.team.members.forEach(m=>solo[m.id]=d.solo[m.id]||0);S.team.groups.forEach(g=>syn[g.id]=d.syn[g.id]||0);
  const r=shapley(solo,syn);const sh=shares(r.phi,r.total);$('#sumNote').textContent='Whole-team value from your scores: '+fmt(r.total,0)+' points';
  $('#preview').innerHTML=r.total>0?`<div class="stack" role="img" aria-label="Your implied split">${S.team.members.map(m=>`<div style="flex:${Math.max(0,sh[m.id])};background:${col(m.id)}">${sh[m.id]>=6?esc(m.name)+' '+fmt(sh[m.id])+'%':''}</div>`).join('')}<div style="flex:${S.team.pool};background:#8E99AB">${S.team.pool>=6?'Pool '+S.team.pool+'%':''}</div></div>`:'<p class="muted">Enter some scores to see the split.</p>'}

/* ===================== 3. status & reveal ===================== */
function renderStatus(){const T=S.team;const ps=participants();const fac=isFac();
  const byMember={};ps.forEach(p=>{(byMember[p.memberId]=byMember[p.memberId]||[]).push(p)});
  const done=T.members.filter(m=>(byMember[m.id]||[]).some(p=>p.state==='submitted'&&p.f===S.fp)).length;
  $('#view-status').innerHTML=`
  <div class="panel"><div class="panel-h"><h2>Who has scored</h2><span class="badge ${done===T.members.length?'ok':'grey'}">${done} of ${T.members.length} submitted</span></div>
   ${R.example?'<p class="muted">The example was scored as one agreed set from the video, so no individual founders are listed.</p>':''}
   <div class="list">${T.members.map(m=>{const p=byMember[m.id]||[];const sub=p.find(x=>x.state==='submitted');const stale=sub&&sub.f!==S.fp;
     const st=stale?'<span class="badge warn">Must score again (setup changed)</span>':sub?'<span class="badge ok">Submitted</span>':p.length?'<span class="badge">Scoring now</span>':'<span class="badge grey">Not started</span>';
     return `<div class="item"><span class="dot" style="background:${col(m.id)}"></span><span class="grow"><b>${esc(m.name)}</b>${p.length>1?' <span class="badge warn">chosen on '+p.length+' devices</span>':''}</span>${st}</div>`}).join('')}</div></div>
  <div class="panel"><div class="panel-h"><h2>${R.revealed?'Scores are revealed':'Reveal'}</h2></div>
   ${R.revealed?`<p>Everyone can now see the results. ${fac?'If the team wants a second round after discussing the disagreements, hide the scores to reopen scoring. Founders keep their previous numbers and can adjust them.':'Only the facilitator can reopen scoring.'}</p>
     ${fac&&!R.example?'<div class="row"><button class="btn danger" type="button" id="hideBtn">Hide scores and reopen scoring</button></div>':''}`
   :fac?`<p>Reveal when everyone has submitted. All scores become visible at once, and they are locked until you reopen scoring.</p>
     ${ui.confirmReveal?`<div class="callout warn"><p>${T.members.length-done} ${T.members.length-done===1?'person has':'people have'} not submitted yet. Reveal anyway?</p><div class="row" style="margin-top:8px"><button class="btn primary small" type="button" id="revealYes">Reveal now</button><button class="btn small" type="button" id="revealNo">Wait</button></div></div>`
      :`<div class="row"><button class="btn primary" type="button" id="revealBtn">Reveal all scores</button></div>`}`
   :'<p class="muted">Waiting for the facilitator to reveal the scores. Results appear for everyone at the same moment.</p>'}
  </div>`;
  const rv=$('#revealBtn');if(rv)rv.addEventListener('click',()=>{if(done<T.members.length){ui.confirmReveal=true;renderStatus()}else reveal(true)});
  const ry=$('#revealYes');if(ry)ry.addEventListener('click',()=>reveal(true));const rn=$('#revealNo');if(rn)rn.addEventListener('click',()=>{ui.confirmReveal=false;renderStatus()});
  const hb=$('#hideBtn');if(hb)hb.addEventListener('click',()=>reveal(false))}
async function reveal(on){ui.confirmReveal=false;await W({revealed:on});toast(on?'Scores revealed':'Scoring reopened');if(on)setTimeout(()=>setTab('results'),300)}

/* ===================== 4. results ===================== */
function renderResults(){const T=S.team;const box=$('#view-results');const ps=participants();
  if(!R.revealed){const n=ps.filter(p=>p.state==='submitted').length;box.innerHTML=`<div class="panel"><h2>Results are sealed</h2><p class="muted">${n} of ${T.members.length} founders have submitted. Results appear for everyone when the facilitator reveals the scores.</p></div>`;return}
  if(!SCORES_LOADED){box.innerHTML='<div class="panel"><p class="muted">Loading scores…</p></div>';return}
  if(!S.sets.length){box.innerHTML=`<div class="panel"><h2>No usable scores</h2><p class="muted">${S.stale?'All submitted scores were made for an earlier setup. Reopen scoring so everyone can score the current setup.':'Nobody had submitted when the scores were revealed. Reopen scoring under Status & reveal.'}</p></div>`;return}
  const A=averaged();const r=shapley(A.solo,A.syn);const sh=shares(r.phi,r.total);const n=T.members.length;const pot=100-T.pool;
  const order=[...T.members].sort((a,b)=>r.phi[b.id]-r.phi[a.id]);const maxPhi=Math.max(...order.map(m=>r.phi[m.id]),1);
  const negatives=T.members.filter(m=>r.phi[m.id]<=0);
  const flags=[];if(S.sets.length>1){T.members.forEach(m=>{const s=A.spread['s'+m.id];if(s.n>1&&s.max-s.min>=Math.max(5,0.5*Math.abs(s.avg)))flags.push({what:m.name+' (solo)',...s})});
    T.groups.forEach(g=>{const s=A.spread['g'+g.id];if(s.n>1&&s.max-s.min>=Math.max(5,0.5*Math.abs(s.avg)))flags.push({what:gName(g),...s})});flags.sort((a,b)=>(b.max-b.min)-(a.max-a.min))}
  const per=S.sets.map(x=>{const so={},sy={};T.members.forEach(m=>so[m.id]=Number.isFinite(x.solo[m.id])?x.solo[m.id]:A.solo[m.id]);T.groups.forEach(g=>sy[g.id]=Number.isFinite(x.syn[g.id])?x.syn[g.id]:A.syn[g.id]);const rr=shapley(so,sy);return{by:x.by,sh:shares(rr.phi,rr.total)}});
  const cc=crossCheck(A.solo,A.syn);const maxDiff=cc?Math.max(...T.members.map((m,i)=>Math.abs(cc.phi[i]-r.phi[m.id]))):null;
  const missing=T.members.filter(m=>!S.sets.some(s=>s.byId===m.id));
  box.innerHTML=`
  ${S.example?`<div class="callout">This is the <b>LoopBox example</b> from the course video, scored as one agreed set. Create your own team on the start page to run private scoring.</div>`:''}
  ${!S.example&&missing.length?`<div class="callout warn">Averaged without ${missing.map(m=>esc(m.name)).join(', ')}, who did not submit before the reveal.</div>`:''}
  ${S.stale?`<div class="callout warn">${S.stale} score set${S.stale>1?'s were':' was'} made for an earlier setup and ${S.stale>1?'are':'is'} left out.</div>`:''}
  <div class="panel">
   <div class="panel-h"><h2>${esc(T.name)}: founder equity</h2><span class="muted">Averaged over ${S.sets.length} score set${S.sets.length>1?'s':''} · ${T.pool}% option pool</span></div>
   <div class="stack" role="img" aria-label="Equity split">${order.map(m=>`<div style="flex:${Math.max(0,sh[m.id])};background:${col(m.id)}">${sh[m.id]>=7?esc(m.name)+' '+fmt(sh[m.id])+'%':''}</div>`).join('')}<div style="flex:${T.pool};background:#8E99AB">${T.pool>=7?'Pool '+T.pool+'%':''}</div></div>
   ${r.total<=0?`<div class="callout warn">The scores add up to ${fmt(r.total,0)} points in total, so there is nothing to split. Check for large negative synergies.</div>`:''}
   ${negatives.length&&r.total>0?`<div class="callout warn">${negatives.map(m=>esc(m.name)).join(', ')} ${negatives.length>1?'come':'comes'} out at zero or below, because negative synergies outweigh their solo value. Discuss it before using these numbers.</div>`:''}
   <div class="tbl-wrap"><table>
    <thead><tr><th>Person</th><th class="r">Shapley points</th><th style="width:34%"></th><th class="r">Equity</th><th class="r">Equal split</th></tr></thead>
    <tbody>${order.map(m=>`<tr><td><span class="row" style="gap:8px"><span class="dot" style="background:${col(m.id)}"></span><b>${esc(m.name)}</b></span></td>
      <td class="r num">${fmt(r.phi[m.id])}</td><td><div class="bar"><i style="width:${Math.max(0,r.phi[m.id])/maxPhi*100}%;background:${col(m.id)}"></i></div></td>
      <td class="r num"><b>${fmt(sh[m.id])}%</b></td><td class="r num muted">${fmt(pot/n)}%</td></tr>`).join('')}
     <tr><td><span class="row" style="gap:8px"><span class="dot" style="background:#8E99AB"></span>Option pool</span></td><td class="r num">–</td><td></td><td class="r num"><b>${fmt(T.pool)}%</b></td><td class="r num muted">${fmt(T.pool)}%</td></tr>
     <tr><td><b>Total</b></td><td class="r num"><b>${fmt(r.total)}</b></td><td></td><td class="r num"><b>100.0%</b></td><td></td></tr></tbody></table></div>
  </div>
  <div class="grid2">
   <div class="panel"><div class="panel-h"><h3>Where each share comes from</h3></div>
    <label class="lbl" for="decomp">Show</label><select id="decomp">${order.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div id="decompOut"></div></div>
   <div class="panel"><div class="panel-h"><h3>Where scorers disagree</h3><span class="muted">${S.sets.length>1?flags.length+' flagged':'Needs 2+ score sets'}</span></div>
    ${S.sets.length<2?'<p class="muted">With several founders, items with widely different scores appear here. Talk those through first: they move the split most.</p>':
     flags.length?`<div class="list">${flags.slice(0,8).map(f=>`<div class="item"><span class="grow"><b>${esc(f.what)}</b></span><span class="num">${fmt(f.min,0)} – ${fmt(f.max,0)}</span><span class="badge warn">avg ${fmt(f.avg)}</span></div>`).join('')}</div>`:'<div class="callout ok">No large disagreements. Every item is within a reasonable range across scorers.</div>'}
   </div>
  </div>
  ${S.sets.length>1?`<div class="panel"><div class="panel-h"><h3>Each scorer's own split</h3><span class="muted">Blanks are filled with the team average</span></div>
   <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Scorer</th>${order.map(m=>`<th class="r">${esc(m.name)}</th>`).join('')}</tr></thead>
   <tbody>${per.map(p=>`<tr><td style="font-family:var(--body)"><b>${esc(p.by)}</b></td>${order.map(m=>`<td class="r">${fmt(p.sh[m.id])}%</td>`).join('')}</tr>`).join('')}
   <tr><td style="font-family:var(--body)"><b>Average</b></td>${order.map(m=>`<td class="r"><b>${fmt(sh[m.id])}%</b></td>`).join('')}</tr></tbody></table></div></div>`:''}
  <div class="panel"><div class="panel-h"><h3>Computation check</h3><span class="badge ok">${cc&&maxDiff<1e-9?'Verified':'Shortcut only'}</span></div>
   <div class="row" style="gap:28px">
    <div class="stat"><span class="muted">Scores entered per founder</span><b>${n+T.groups.length}</b></div>
    <div class="stat"><span class="muted">Coalitions a full table needs</span><b>${(Math.pow(2,n)-1).toLocaleString()}</b></div>
    <div class="stat"><span class="muted">Joining orders covered</span><b>${factStr(n)}</b></div></div>
   <p class="muted">${cc?`The app rebuilt all ${cc.coalitions.toLocaleString()} coalition values from the scores and ran the textbook Shapley formula in ${fmt(cc.ms,1)} ms. Largest difference from the shortcut: ${maxDiff<1e-9?'0 (identical)':maxDiff.toExponential(2)}.`:`With ${n} people the full table would have ${(Math.pow(2,n)-1).toLocaleString()} coalitions, so the app uses the exact shortcut only. It gives the same answer as the full formula.`}</p></div>`;
  const dsel=$('#decomp');const drawD=()=>{const id=dsel.value;const p=r.parts[id].filter(x=>Math.abs(x.v)>1e-9);const pos=p.filter(x=>x.v>0);const tot=pos.reduce((a,b)=>a+b.v,0)||1;
    $('#decompOut').innerHTML=`<div class="stack" role="img" aria-label="Breakdown of ${esc(nameOf(id))}'s points">${pos.map(x=>`<div style="flex:${x.v};background:${x.label==='solo'?col(id):'var(--accent)'};opacity:${x.label==='solo'?1:.75}">${x.v/tot>=.12?fmt(x.v):''}</div>`).join('')}</div>
     <div class="list" style="margin-top:6px">${p.map(x=>`<div class="item"><span class="grow">${x.label==='solo'?'Solo value':esc(x.label)}</span><span class="num">${x.v>=0?'+':''}${fmt(x.v)}</span></div>`).join('')}
     <div class="item"><span class="grow"><b>Shapley points</b></span><span class="num"><b>${fmt(r.phi[id])}</b></span></div></div>`};
  dsel.addEventListener('change',drawD);drawD()}

/* ===================== method ===================== */
function renderMethod(){$('#view-method').innerHTML=`
  <div class="panel"><h2>How to compute coalitions efficiently</h2>
   <p>The textbook Shapley value asks for the worth of every possible group of founders, then averages each person's added value over every possible joining order. That grows fast:</p>
   <div class="tbl-wrap"><table><thead><tr><th>Team size</th><th class="r">Coalitions to score</th><th class="r">Joining orders</th></tr></thead><tbody>
    ${[3,5,8,10,15,20].map(n=>`<tr><td class="num">${n}</td><td class="r num">${(Math.pow(2,n)-1).toLocaleString()}</td><td class="r num">${factStr(n)}</td></tr>`).join('')}</tbody></table></div>
   <ol class="steps">
    <li><b>Score building blocks, not coalitions.</b> Each person gets a solo value, and the team lists only the synergies it believes in. A coalition is worth its members' solo values plus every synergy whose members are all inside it. In game theory these blocks are called Harsanyi dividends.</li>
    <li><b>Use the exact shortcut.</b> With that model the Shapley value has a closed form:
     <div class="formula" style="margin-top:8px">Shapley(i) = solo(i) + Σ over synergies G that include i of value(G) ÷ size(G)</div>
     Each synergy is shared equally among the people who create it. The work grows with the number of scores entered, so a 30-person team computes as fast as a 3-person one.</li>
    <li><b>Average the inputs, not the arguments.</b> The Shapley value is linear, so averaging every founder's scores and then splitting gives exactly the average of their individual splits.</li>
    <li><b>Seal the scores until everyone is done.</b> Seeing someone else's numbers first anchors your own. The database only releases the scores once the facilitator reveals them.</li>
   </ol>
   <p>For teams of up to 14 people, Results also rebuilds the full coalition table and runs the textbook formula (about n × 2ⁿ steps) to confirm the shortcut.</p></div>
  <div class="panel"><h3>Before you sign anything</h3>
   <p>Scores are assumptions, not evidence. Treat the split as the start of the conversation. Agree vesting, typically four years with a one-year cliff starting on each person's first day. Then ask a lawyer to turn the numbers into a shareholders' agreement.</p></div>`}

const RENDER={setup:renderSetup,score:renderScore,status:renderStatus,results:renderResults,method:renderMethod};
route();
</script>
